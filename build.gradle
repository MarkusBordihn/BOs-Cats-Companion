buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath 'com.guardsquare:proguard-gradle:7.8.2'
  }
}

plugins {
  id 'java'
  id 'maven-publish'
  id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
}

// Apply external configuration
apply from: 'gradle/hytale-config.gradle'

group = project.group
version = project.version

base {
  archivesName = "${project.mod_id}-hytale-${project.version}"
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
  withSourcesJar()
}

repositories {
  mavenCentral()
}

dependencies {
  testImplementation platform('org.junit:junit-bom:5.10.0')
  testImplementation 'org.junit.jupiter:junit-jupiter'

  // Hytale Server dependency
  compileOnly files(project.findProperty('hytaleServerJar') ?: 'HytaleServer.jar')
}

if (!file("$projectDir/run").exists()) {
  file("$projectDir/run").mkdirs()
}

// Extract Hytale API class list for reference
tasks.register('extractHytaleApi') {
  group = 'hytale'
  description = 'Extracts Hytale API class files to hytale-api/ for reference'

  def hytaleJar = file(project.findProperty('hytaleServerJar') ?: 'HytaleServer.jar')
  def outputDir = file("$projectDir/hytale-api")

  doLast {
    if (!hytaleJar.exists()) {
      throw new GradleException("HytaleServer.jar not found at: ${hytaleJar}")
    }

    delete outputDir
    outputDir.mkdirs()

    println "Extracting from ${hytaleJar.name}..."

    copy {
      from zipTree(hytaleJar)
      into outputDir
      include 'com/hypixel/hytale/**/*.class'
    }

    // Create index file
    def indexFile = new File(outputDir, 'API_INDEX.txt')
    def classes = []
    outputDir.eachFileRecurse { file ->
      if (file.name.endsWith('.class')) {
        def className = file.absolutePath
            .replace(outputDir.absolutePath + File.separator, '')
            .replace(File.separator, '.')
            .replace('.class', '')
        classes << className
      }
    }

    // Sort and group by package
    def sortedClasses = classes.sort()
    def grouped = [:]
    sortedClasses.each { className ->
      def pkg = className.substring(0, className.lastIndexOf('.'))
      if (!grouped.containsKey(pkg)) {
        grouped[pkg] = []
      }
      grouped[pkg] << className.substring(className.lastIndexOf('.') + 1)
    }

    // Write index with grouping
    indexFile.text = "Hytale API Classes (${classes.size()} total)\n"
    indexFile.text += "=" * 80 + "\n"
    grouped.each { pkg, classList ->
      indexFile.text += "\n${pkg}:\n"
      classList.each { cls ->
        indexFile.text += "  - ${cls}\n"
      }
    }

    println "✅ Extracted ${classes.size()} Hytale classes"
    println "📁 Output: ${outputDir}"
    println "📄 Index: ${indexFile}"
  }
}

tasks.register('proguard', proguard.gradle.ProGuardTask) {
  dependsOn tasks.jar

  // Input JAR
  injars(tasks.named('jar', Jar).flatMap { it.archiveFile })

  // Output JAR
  outjars(layout.buildDirectory.file("libs/${project.mod_id}-hytale-${project.version}-minified.jar"))

  // Library JARs - Java runtime and Hytale Server
  libraryjars "${System.getProperty('java.home')}/jmods/java.base.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
  libraryjars "${System.getProperty('java.home')}/jmods/java.logging.jmod", jarfilter: '!**.jar', filter: '!module-info.class'

  // Hytale Server JAR
  def hytaleJar = file(project.findProperty('hytaleServerJar') ?: 'HytaleServer.jar')
  if (hytaleJar.exists()) {
    libraryjars hytaleJar
  }

  // ProGuard configuration - Maximum obfuscation with precise keeps
  dontoptimize()

  // Keep only essential runtime attributes
  keepattributes 'Signature,Exceptions,*Annotation*'
  keepattributes 'Manifest'

  // Keep main plugin class and components/systems
  keep 'public class de.markusbordihn.cats.Main extends com.hypixel.hytale.server.core.plugin.JavaPlugin { public protected *; }'
  keep 'public class de.markusbordihn.cats.component.CatOwnerComponent { public protected *; }'
  keep 'public class de.markusbordihn.cats.component.CatStateComponent { public protected *; }'
  keep 'public class de.markusbordihn.cats.component.CatStateComponent$CatState { *; }'
  keep 'public class de.markusbordihn.cats.system.CatOwnershipSystem { public <init>(...); }'
  keep 'public class de.markusbordihn.cats.system.CatStateSystem { public <init>(...); }'
  keep 'public class de.markusbordihn.cats.system.CatStateSyncSystem { public <init>(...); }'

  // Keep Action builders (referenced in JSON files and registered via reflection)
  keep 'public class de.markusbordihn.cats.actions.BuilderActionCatInteractionWild { public <init>(); public protected *; }'
  keep 'public class de.markusbordihn.cats.actions.BuilderActionCatInteractionOwner { public <init>(); public protected *; }'
  keep 'public class de.markusbordihn.cats.actions.BuilderActionCatInteractionStranger { public <init>(); public protected *; }'

  // Keep enum structure
  keepclassmembers 'enum * { public static **[] values(); public static ** valueOf(java.lang.String); }'

  // Interaction classes, Commands, and Handlers will be obfuscated (only used internally)

  // Don't print notes about potential issues
  dontnote

  // Don't warn about Hytale runtime dependencies
  dontwarn 'com.hypixel.hytale.**'
  dontwarn 'javax.annotation.**'

  verbose
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
  options.incremental = true
  options.fork = true
  options.forkOptions.memoryMaximumSize = '2g'
}

test {
  useJUnitPlatform()
}

jar {
  manifest {
    attributes([
        'Specification-Title'   : project.mod_name,
        'Specification-Vendor'  : project.vendor_name,
        'Specification-Version' : project.version,
        'Implementation-Title'  : project.mod_name,
        'Implementation-Version': project.version,
        'Implementation-Vendor' : project.vendor_name,
    ])
  }
}

// IntelliJ IDEA run configuration
def serverRunDir = file("$projectDir/run")

idea.project.settings.runConfigurations {
  'HytaleServer'(org.jetbrains.gradle.ext.Application) {
    mainClass = 'com.hypixel.hytale.Main'
    moduleName = project.idea.module.name + '.main'

    def hytaleHome = project.findProperty('hytaleHome') ?: 'G:/Hytale/install/release'
    def patchline = project.findProperty('patchline') ?: 'package/game/latest'
    def assetsPath = "${hytaleHome}/${patchline}/Assets.zip"
    def modsPath = file("src/main/").absolutePath

    programParameters = "--allow-op --assets=${assetsPath} --mods=${modsPath}"
    workingDirectory = serverRunDir.absolutePath
  }
}
